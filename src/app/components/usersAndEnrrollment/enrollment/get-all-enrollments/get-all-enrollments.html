<p-table [value]="enrollments" class="p-datatable-sm" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Student</th>
      <th>Course</th>
      <th>Date</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-enrollment>
    <tr>
      <td>{{ enrollment.id }}</td>
      <td>{{ studentName(enrollment.studentId) }}</td>
      <td>{{ courseTitle(enrollment.courseId) }}</td>
      <td>{{ enrollment.date | date:'mediumDate' }}</td>
      <td>
        <span [ngClass]="{
          'text-green-600 font-bold': enrollment.status === 'ACTIVE',
          'text-red-600 font-bold': enrollment.status === 'INACTIVE'
        }">
          {{ enrollment.status }}
        </span>
      </td>
      <td>
        <button pButton label="Edit" icon="pi pi-pencil" class="p-button-sm p-button-text"></button>
        <button pButton label="Delete" icon="pi pi-trash" class="p-button-sm p-button-danger p-button-text"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
