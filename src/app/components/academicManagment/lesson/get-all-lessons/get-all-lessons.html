<div class="card">
  <p-table [value]="lessons" [tableStyle]="{ 'min-width': '55rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Content</th>
        <th>Module</th>
        <th>Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-lesson>
      <tr>
        <td>{{ lesson.id }}</td>
        <td>{{ lesson.title }}</td>
        <td>{{ lesson.content }}</td>
        <td>{{ moduleName(lesson.moduleId) }}</td>
        <td>{{ lesson.status }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
