<form [formGroup]="form" (ngSubmit)="submit()" class="w-full p-6 bg-white rounded shadow">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <!-- Título -->
    <div>
      <label class="block mb-1 font-semibold">Título</label>
      <input pInputText formControlName="title" class="w-full" placeholder="Ej: Desarrollo Web" />
    </div>

    <!-- Estado -->
    <div>
      <label class="block mb-1 font-semibold">Estado</label>
      <p-select
        [options]="statuses"
        optionLabel="label"
        optionValue="value"
        formControlName="status"
        placeholder="Seleccione estado"
        class="w-full">
      </p-select>
    </div>

    <!-- Descripción -->
    <div class="md:col-span-2">
      <label class="block mb-1 font-semibold">Descripción</label>
      <textarea
        pInputTextarea
        rows="4"
        formControlName="description"
        class="w-full"
        placeholder="Descripción del curso"></textarea>
    </div>

    <!-- Fecha de inicio -->
    <div>
      <label class="block mb-1 font-semibold">Fecha inicio</label>
      <p-datepicker formControlName="startDate" dateFormat="yy-mm-dd" class="w-full"></p-datepicker>
    </div>

    <!-- Fecha fin -->
    <div>
      <label class="block mb-1 font-semibold">Fecha fin</label>
      <p-datepicker formControlName="endDate" dateFormat="yy-mm-dd" class="w-full"></p-datepicker>
    </div>

    <!-- Profesor -->
    <div class="md:col-span-2">
      <label class="block mb-1 font-semibold">Profesor</label>
      <p-select
        [options]="teachers"
        optionLabel="name"
        optionValue="id"
        formControlName="teacherId"
        placeholder="Seleccione profesor"
        class="w-full">
      </p-select>
    </div>
  </div>

  <!-- Botones -->
  <div class="flex justify-center mt-6">
    <div class="bg-gray-100 rounded p-4 flex gap-4 items-center">
      <button
        pButton
        type="submit"
        class="p-button p-component bg-primary text-white"
        label="Guardar"
        icon="pi pi-save"
      ></button>
      <button
        pButton
        type="button"
        class="p-button p-component p-button-secondary"
        label="Cancelar"
        icon="pi pi-times"
        (click)="cancelar()"
      ></button>
    </div>
  </div>
</form>
