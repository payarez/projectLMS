<form [formGroup]="form" (ngSubmit)="submit()" class="w-full p-6 bg-white rounded shadow">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <!-- Título -->
    <div>
      <label class="block mb-1 font-semibold">Título</label>
      <input pInputText formControlName="title" class="w-full" placeholder="Nombre del foro" />
    </div>

    <!-- Curso -->
    <div>
      <label class="block mb-1 font-semibold">Curso</label>
      <p-select
        [options]="courses"
        optionLabel="title"
        optionValue="id"
        formControlName="courseId"
        placeholder="Seleccione curso"
        class="w-full">
      </p-select>
    </div>

    <!-- Descripción -->
    <div class="col-span-2">
      <label class="block mb-1 font-semibold">Descripción</label>
      <textarea
        pInputTextarea
        formControlName="description"
        class="w-full"
        rows="3"
        placeholder="Describe el propósito del foro">
      </textarea>
    </div>

    <!-- Estado -->
    <div>
      <label class="block mb-1 font-semibold">Estado</label>
      <p-select
        [options]="statuses"
        optionLabel="label"
        optionValue="value"
        formControlName="status"
        placeholder="Seleccione estado"
        class="w-full">
      </p-select>
    </div>
  </div>

  <!-- Botones -->
  <div class="flex justify-center mt-6">
    <div class="bg-gray-100 rounded p-4 flex gap-4 items-center">
      <button
        pButton
        type="submit"
        class="p-button p-component bg-primary text-white"
        label="Guardar"
        icon="pi pi-save"
      ></button>
      <button
        pButton
        type="button"
        class="p-button p-component p-button-secondary"
        label="Cancelar"
        icon="pi pi-times"
        (click)="cancelar()"
      ></button>
    </div>
  </div>
</form>
