<p-table [value]="tags" class="p-datatable-sm" [tableStyle]="{ 'min-width': '30rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Status</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-tag>
    <tr>
      <td>{{ tag.id }}</td>
      <td>{{ tag.name }}</td>
      <td>
        <span [ngClass]="{ 'text-green-600': tag.status === 'ACTIVE', 'text-red-600': tag.status === 'INACTIVE' }">
          {{ tag.status }}
        </span>
      </td>
    </tr>
  </ng-template>
</p-table>
