<div class="card">
  <p-table [value]="posts" [tableStyle]="{ 'min-width': '60rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Content</th>
        <th>Forum</th>
        <th>Student</th>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-post>
      <tr>
        <td>{{ post.id }}</td>
        <td>{{ post.content }}</td>
        <td>{{ forumName(post.forumId) }}</td>
        <td>{{ studentName(post.studentId) }}</td>
        <td>{{ post.date | date:'short' }}</td>
        <td>{{ post.status }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
