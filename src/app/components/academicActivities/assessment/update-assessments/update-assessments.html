<div class="p-6 bg-custom-gradient w-full h-full">
  <div class="card shadow-md rounded-lg bg-gray-50 p-6 max-w-4xl mx-auto">

    <!-- Encabezado -->
    <h2 class="text-3xl font-bold text-gray-800 mb-6 flex items-center gap-3">
      <i class="pi pi-refresh text-3xl text-gray-700"></i>
      Editar Calificación (Assessment)
    </h2>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="w-full">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Nota -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Nota</label>
          <input
            pInputText
            type="number"
            formControlName="grade"
            class="w-full rounded-md shadow-sm border border-gray-300 
                   focus:ring-2 focus:ring-blue-400 focus:border-blue-400 p-2"
            placeholder="Ej: 4.5"
          />
          <small class="text-red-600 text-sm" *ngIf="getFieldError('grade')">
            {{ getFieldError('grade') }}
          </small>
        </div>

        <!-- Estado -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Estado</label>
          <p-select
            [options]="statuses"
            optionLabel="label"
            optionValue="value"
            formControlName="status"
            placeholder="Seleccione estado"
            class="w-full rounded-md shadow-sm border border-gray-300"
          ></p-select>

          <small class="text-red-600 text-sm" *ngIf="getFieldError('status')">
            {{ getFieldError('status') }}
          </small>
        </div>

        <!-- Fecha -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Fecha</label>
          <p-datepicker
            formControlName="date"
            dateFormat="yy-mm-dd"
            class="w-full rounded-md shadow-sm border border-gray-300"
          ></p-datepicker>

          <small class="text-red-600 text-sm" *ngIf="getFieldError('date')">
            {{ getFieldError('date') }}
          </small>
        </div>

        <!-- Feedback -->
<div class="md:col-span-2">
  <label class="block mb-2 font-semibold text-gray-700">Feedback</label>

  <textarea
    pInputTextarea
    formControlName="feedback"
    rows="4"
    class="w-full rounded-md shadow-sm border border-gray-300 p-2
           bg-white text-gray-800 focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
    placeholder="Escribe retroalimentación aquí..."
  ></textarea>

  <small class="text-red-600 text-sm" *ngIf="getFieldError('feedback')">
    {{ getFieldError('feedback') }}
  </small>
</div>


        <!-- Submission -->
        <div class="md:col-span-2">
          <label class="block mb-2 font-semibold text-gray-700">Entrega (Submission)</label>

          <p-select
            [options]="submissions"
            optionLabel="content"
            optionValue="id"
            formControlName="submissionId"
            placeholder="Seleccione la entrega"
            class="w-full rounded-md shadow-sm border border-gray-300"
          ></p-select>

          <small class="text-red-600 text-sm" *ngIf="getFieldError('submissionId')">
            {{ getFieldError('submissionId') }}
          </small>
        </div>

      </div>

      <!-- Botones -->
      <div class="flex justify-center mt-6">
        <div class="bg-gray-100 rounded-lg p-4 flex gap-4 items-center shadow-sm">

          <button
            pButton
            type="submit"
            [disabled]="loading"
            class="p-button p-component bg-blue-600 text-white hover:bg-blue-700"
            label="Actualizar"
            icon="pi pi-refresh"
          ></button>

          <button
            pButton
            type="button"
            class="p-button p-component bg-gray-400 text-white hover:bg-gray-500"
            label="Cancelar"
            icon="pi pi-times"
            (click)="cancelar()"
          ></button>

        </div>
      </div>
    </form>
  </div>
</div>

<p-toast></p-toast>
