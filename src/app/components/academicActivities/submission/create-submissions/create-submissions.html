<div class="p-6 bg-custom-gradient w-full h-full">
  <div class="card shadow-md rounded-lg bg-gray-50 p-6 max-w-4xl mx-auto">

    <h2 class="text-3xl font-bold text-gray-800 mb-6 flex items-center gap-3">
      <i class="pi pi-upload text-3xl text-gray-700"></i>
      Crear Entrega
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="w-full">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Contenido -->
        <div class="md:col-span-2">
          <label class="block mb-2 font-semibold text-gray-700">Contenido</label>
          <input
            pInputText
            type="text"
            formControlName="content"
            class="w-full rounded-md shadow-sm border border-gray-300 
                   focus:ring-2 focus:ring-blue-400 focus:border-blue-400 p-2"
            placeholder="Ej: Proyecto PDF subido"
          />
          <small class="text-red-600 text-sm" *ngIf="getFieldError('content')">
            {{ getFieldError('content') }}
          </small>
        </div>

        <!-- Fecha de envío -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Fecha de envío</label>
          <p-datepicker
            formControlName="submittedAt"
            dateFormat="yy-mm-dd"
            class="w-full rounded-md shadow-sm border border-gray-300"
          ></p-datepicker>
          <small class="text-red-600 text-sm" *ngIf="getFieldError('submittedAt')">
            {{ getFieldError('submittedAt') }}
          </small>
        </div>

        <!-- Estado -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Estado</label>
          <p-select
            [options]="statuses"
            optionLabel="label"
            optionValue="value"
            formControlName="status"
            placeholder="Seleccione estado"
            class="w-full rounded-md shadow-sm border border-gray-300"
          ></p-select>
          <small class="text-red-600 text-sm" *ngIf="getFieldError('status')">
            {{ getFieldError('status') }}
          </small>
        </div>

        <!-- Estudiante -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Estudiante</label>
          <p-select
            [options]="students"
            optionLabel="label"
            optionValue="value"
            formControlName="studentId"
            placeholder="Seleccione estudiante"
            class="w-full rounded-md shadow-sm border border-gray-300"
          ></p-select>
          <small class="text-red-600 text-sm" *ngIf="getFieldError('studentId')">
            {{ getFieldError('studentId') }}
          </small>
        </div>

        <!-- Lección -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Lección</label>
          <p-select
            [options]="lessons"
            optionLabel="label"
            optionValue="value"
            formControlName="lessonId"
            placeholder="Seleccione lección"
            class="w-full rounded-md shadow-sm border border-gray-300"
          ></p-select>
          <small class="text-red-600 text-sm" *ngIf="getFieldError('lessonId')">
            {{ getFieldError('lessonId') }}
          </small>
        </div>

      </div>

      <!-- Botones -->
      <div class="flex justify-center mt-6">
        <div class="bg-gray-100 rounded-lg p-4 flex gap-4 items-center shadow-sm">

          <button
            pButton
            type="submit"
            [disabled]="loading"
            class="p-button bg-green-600 text-white hover:bg-green-700"
            label="Guardar"
            icon="pi pi-save"
          ></button>

          <button
            pButton
            type="button"
            class="p-button bg-gray-400 text-white hover:bg-gray-500"
            label="Cancelar"
            icon="pi pi-times"
            (click)="cancelar()"
          ></button>

        </div>
      </div>

    </form>
  </div>
</div>

<p-toast></p-toast>
