<div class="p-6 bg-custom-gradient w-full h-full">
  <p-confirmDialog appendTo="body"></p-confirmDialog>

  <!-- Encabezado -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-3xl font-bold text-white tracking-wide flex items-center gap-3 text-shadow-custom">
      <i class="pi pi-check-circle text-white text-3xl text-shadow-custom"></i>
      Gestión de Entregas
    </h2>

    <div class="flex items-center gap-3">
      <!-- Barra de búsqueda -->
      <i class="pi pi-search text-white text-shadow-custom"></i>
      <span class="p-input-icon-left w-64">
        <input
          pInputText
          type="text"
          placeholder=" Buscar submission..."
          (input)="dt.filterGlobal($event.target.value, 'contains')"
          class="p-inputtext-sm w-full rounded-md shadow-sm border border-gray-300 
                 focus:outline-none focus:ring-0 focus:border-gray-300 text-white text-shadow-custom"
        />
      </span>

      <!-- Botón agregar -->
      <button
        pButton
        type="button"
        class="p-button-sm p-button-rounded p-button-success shadow-md"
        label="Agregar"
        icon="pi pi-plus"
        [routerLink]="['/submissions/new']"
      ></button>
    </div>
  </div>

  <!-- Panel -->
  <div class="card shadow-md rounded-lg bg-gray-50 p-5">
    <!-- Subtítulo -->
    <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
      <i class="pi pi-list text-gray-500"></i>
      Lista de Entregas
    </h3>

    <!-- Tabla -->
    <p-table
      #dt
      [value]="submissions"
      stripedRows
      paginator
      [rows]="5"
      [rowsPerPageOptions]="[5,10,20]"
      [globalFilterFields]="[
        'id','content','submittedAt','lessonId','studentId','status'
      ]"
      class="p-datatable-sm p-datatable-gridlines p-datatable-striped 
             rounded-md overflow-hidden bg-white"
      [tableStyle]="{ 'min-width': '70rem' }"
    >
      <ng-template pTemplate="header">
        <tr class="bg-gray-100 text-gray-700 uppercase text-sm tracking-wide">
          <th pSortableColumn="id" class="px-4 py-2 text-left">
            ID <p-sortIcon field="id"></p-sortIcon>
          </th>

          <th pSortableColumn="content" class="px-4 py-2 text-left">
            Contenido <p-sortIcon field="content"></p-sortIcon>
          </th>

          <th pSortableColumn="submittedAt" class="px-4 py-2 text-left">
            Fecha <p-sortIcon field="submittedAt"></p-sortIcon>
          </th>

          <th pSortableColumn="lessonId" class="px-4 py-2 text-left">
            Lección <p-sortIcon field="lessonId"></p-sortIcon>
          </th>

          <th pSortableColumn="studentId" class="px-4 py-2 text-left">
            Estudiante <p-sortIcon field="studentId"></p-sortIcon>
          </th>

          <th pSortableColumn="status" class="px-4 py-2 text-left">
            Estado <p-sortIcon field="status"></p-sortIcon>
          </th>

          <th class="px-4 py-2 text-center">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-submission>
        <tr class="hover:bg-gray-50 transition">
          <td class="px-4 py-2 font-medium text-gray-800">{{ submission.id }}</td>

          <td class="px-4 py-2">{{ submission.content }}</td>

          <td class="px-4 py-2">{{ submission.submittedAt | date:'short' }}</td>

          <td class="px-4 py-2">{{ lessonName(submission.lessonId) }}</td>

          <td class="px-4 py-2">{{ studentName(submission.studentId) }}</td>

          <td class="px-4 py-2">
            <p-tag
              [value]="submission.status"
              [severity]="submission.status === 'ACTIVE' ? 'success' : 'danger'"
              styleClass="px-3 py-1 font-medium rounded-full"
            ></p-tag>
          </td>

          <!-- ACCIONES -->
          <td class="text-center">
            <div class="flex justify-center gap-2">

              <!-- Editar -->
              <button
                pButton
                type="button"
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-warning"
                [routerLink]="['/submissions/edit/', submission.id]"
                pTooltip="Editar"
              ></button>

              <!-- Eliminar -->
              <button
                pButton
                type="button"
                icon="pi pi-trash"
                class="p-button-rounded p-button-text p-button-danger"
                (click)="deleteSubmission(submission)"
                pTooltip="Eliminar"
              ></button>

            </div>
          </td>
        </tr>
      </ng-template>

    </p-table>
  </div>
</div>
